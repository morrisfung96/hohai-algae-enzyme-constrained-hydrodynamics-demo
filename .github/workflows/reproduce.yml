name: Frozen-result reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verified.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/verify_assets.py
      - run: python scripts/validate_response.py
      - run: python scripts/reproduce_metrics.py
      - run: python scripts/reproduce_figures.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s src/lake_mc/ecology -p test_fixture.py -v
